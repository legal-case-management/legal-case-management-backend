plugins {
    id 'java'
    id 'org.springframework.boot' version '3.5.3'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'kds'
version = '0.0.1-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-web'
    developmentOnly 'org.springframework.boot:spring-boot-devtools'
    developmentOnly 'org.springframework.boot:spring-boot-docker-compose'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

    implementation("org.mariadb.jdbc:mariadb-java-client:3.5.3")
    implementation("org.projectlombok:lombok:1.18.38")
    annotationProcessor("org.projectlombok:lombok:1.18.38")

    implementation("org.springframework.boot:spring-boot-starter-validation:3.5.0")
    implementation("org.springframework.boot:spring-boot-starter-oauth2-resource-server:3.5.0")
    implementation("org.mapstruct:mapstruct:1.6.3")
    annotationProcessor("org.mapstruct:mapstruct-processor:1.6.3")

    implementation("org.springframework.security:spring-security-crypto:6.5.0")
    implementation("com.nimbusds:nimbus-jose-jwt:10.3")
    implementation("com.fasterxml.jackson.datatype:jackson-datatype-jsr310:2.19.0")

    /* Redis */
    implementation("org.springframework.boot:spring-boot-starter-data-redis:3.5.3")

    implementation("org.springframework.boot:spring-boot-starter-mail:3.5.5")

}

tasks.named('test') {
    useJUnitPlatform()
}
