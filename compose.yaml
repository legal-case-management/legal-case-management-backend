name: QuanLyAn_Server
services:
  mariadb:
    image: mariadb:11.3
    ports:
      - "3306:3306"
    environment:
      MARIADB_ROOT_PASSWORD: 123
      MARIADB_DATABASE: QuanLyAn_ToaAnKhuVuc9_DongThap
      MARIADB_USER: root
      MARIADB_PASSWORD: 123
    volumes:
      - mariadb_data:/var/lib/mysql

  redis:
    image: redis:7.2
    container_name: redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: ["redis-server", "--appendonly", "yes"]

volumes:
  mariadb_data:
  redis_data:
