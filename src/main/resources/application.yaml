spring:
  application:
    name: QuanLyAn_Server

  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASS}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: ${HIBERNATE_DDL}
    show-sql: true
    properties:
      hibernate:
        dialect: ${HIBERNATE_DIALECT}

  mail:
    host: ${MAIL_HOST}
    port: ${MAIL_PORT}
    username: ${MAIL_USER}
    password: ${MAIL_PASS}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
        debug: false
  data:
    redis:
      url: ${REDIS_URL}
      ssl:
        enabled: true

# JWT
jwt:
  signerKey: ${JWT_SIGNER_KEY}
  valid-duration: ${JWT_VALID_DURATION}
  reset-password-duration: ${JWT_RESET_DURATION}
  refreshable-duration: ${JWT_REFRESH_DURATION}

# Authentication
auth:
  default-password: ${AUTH_DEFAULT_PASSWORD}

# HTTPS Configuration
server:
  address: 0.0.0.0
  port: ${SERVER_PORT}
  ssl:
    key-store: ${SSL_KEYSTORE}
    key-store-password: ${SSL_KEYSTORE_PASS}
    key-store-type: ${SSL_KEYSTORE_TYPE}
    key-alias: ${SSL_KEY_ALIAS}
